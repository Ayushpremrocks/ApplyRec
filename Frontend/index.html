<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0f" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Track your job applications - ApplyRec" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <title>ApplyRec</title>
    <script>
      // Apply the saved theme before first paint (no light/dark flash).
      try {
        var t = localStorage.getItem(theme);
        if (t === light || t === dark) document.documentElement.setAttribute(data-theme, t);
      } catch (e) {}
    </script>
    <style>
      body { background-color: #f6f6f3; }
      @media (prefers-color-scheme: dark) { html:not([data-theme="light"]) body { background-color: #0a0a0f; } }
      html[data-theme="dark"] body { background-color: #0a0a0f; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
