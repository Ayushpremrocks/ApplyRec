server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: applyrec-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        # Loads tags/interviews for a whole page of applications in one query each (no N+1).
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    # Must be at least 32 bytes; the app refuses to start otherwise.
    secret: ${JWT_SECRET}
    expiration-days: 7
  cors:
    # Comma-separated origins/patterns, e.g. https://applyrec.vercel.app,https://*.vercel.app
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  dev-seed:
    # Only honoured together with the "dev" profile.
    enabled: ${APP_DEV_SEED_ENABLED:false}
  # Public URL of the frontend; used for links in emails (password reset, reminders).
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  mail:
    # Without a key, emails are not sent (dev profile logs them to the console instead).
    resend-api-key: ${RESEND_API_KEY:}
    from: ${MAIL_FROM:ApplyRec <onboarding@resend.dev>}
  reminders:
    # How often to look for interviews in the next 24h that still need a reminder.
    interval-ms: ${APP_REMINDER_INTERVAL_MS:600000}
  rate-limit:
    login-failures-per-email: 5   # per 15 minutes
    login-per-ip: 30              # per 10 minutes
    signup-per-ip: 10             # per hour
    password-reset-per-ip: 10     # per 15 minutes

---
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    org.hibernate.SQL: DEBUG
