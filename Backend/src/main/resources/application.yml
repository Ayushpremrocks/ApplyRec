server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: applyrec-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    # Must be at least 32 bytes; the app refuses to start otherwise.
    secret: ${JWT_SECRET}
    expiration-days: 7
  cors:
    # Comma-separated origins/patterns, e.g. https://applyrec.vercel.app,https://*.vercel.app
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  dev-seed:
    # Only honoured together with the "dev" profile.
    enabled: ${APP_DEV_SEED_ENABLED:false}

---
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    org.hibernate.SQL: DEBUG
